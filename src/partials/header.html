<a class="skip-link" href="#inhalt">Zum Inhalt springen</a>
<if condition="global.announcement && global.announcement.show && global.announcement.text">
  <div class="announcement">
    <div class="container">
      <a href="{{ global.announcement.link || '#' }}" data-t="global.announcement.text">{{ global.announcement.text }}</a>
    </div>
  </div>
</if>
<header class="site-header" id="top">
  <div class="container header-inner">
    <a class="brand" href="/" aria-label="Newness of Life – Startseite">
      <img class="brand-logo" src="/images/Logo_Schwarz_Transparent_KS.png" data-src="global.header.logo.image" alt="{{ global.header.logo.alt }}" width="52" height="52">
      <span class="brand-text">
        <span class="brand-name" data-t="global.header.logo.text">Newness of Life</span>
        <span class="brand-sub" data-t="global.header.logo.subtext">Die Kirche des lebendigen Gottes International e.V.</span>
      </span>
    </a>
    <nav class="main-nav" id="main-nav" aria-label="Hauptnavigation">
      <ul>
        <each loop="item, i in global.header.navigation">
          <if condition="item.show !== false">
            <li><a href="{{ item.url }}" class="{{ (item.url === '/' + currentPage) || (currentPage === 'index' && item.url === '/') ? 'is-active' : '' }}" data-t="global.header.navigation.{{ i }}.label">{{ item.label }}</a></li>
          </if>
        </each>
      </ul>
      <div class="nav-actions">
        <button type="button" class="lang-toggle" id="langToggle" aria-label="Switch to English">EN</button>
        <if condition="global.header.cta_button && global.header.cta_button.show !== false">
          <a class="btn btn-gold btn-sm" href="{{ global.header.cta_button.url }}" data-t="global.header.cta_button.text">Spenden</a>
        </if>
      </div>
    </nav>
    <button type="button" class="menu-toggle" aria-controls="main-nav" aria-expanded="false">
      <span class="sr-only">Menü öffnen</span>
      <span class="menu-bars" aria-hidden="true"></span>
    </button>
  </div>
</header>
