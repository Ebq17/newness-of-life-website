<!DOCTYPE html>
<html lang="de">
<head>
  <include src="partials/head-common.html"></include>
  <title>{{ pages.veranstaltungen.seo.meta_title }}</title>
  <meta name="description" content="{{ pages.veranstaltungen.seo.meta_description }}">
  <link rel="canonical" href="https://newnessoflife.de/veranstaltungen">
  <meta property="og:title" content="{{ pages.veranstaltungen.seo.meta_title }}">
  <meta property="og:description" content="{{ pages.veranstaltungen.seo.meta_description }}">
  <meta property="og:url" content="https://newnessoflife.de/veranstaltungen">
  <meta property="og:image" content="https://newnessoflife.de{{ pages.veranstaltungen.hero.background_image || '/images/Gebete.jpg' }}">
  {{{ eventsJsonLd }}}
</head>
<body class="page-events">
  <include src="partials/header.html"></include>

  <main id="inhalt">
    <section class="hero hero-page" data-bg="pages.veranstaltungen.hero.background_image">
      <div class="container hero-inner">
        <h1 data-t="pages.veranstaltungen.hero.title"></h1>
        <p class="hero-lead" data-t="pages.veranstaltungen.hero.subtitle"></p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="section-head">
          <h2 data-t="pages.veranstaltungen.upcoming.title"></h2>
          <p data-t="pages.veranstaltungen.upcoming.subtitle"></p>
        </div>

        <if condition="eventsByMonth.length > 1">
          <div class="month-filter" role="group" aria-label="Monat auswählen">
            <button type="button" class="month-chip" data-month="all" aria-pressed="true" data-t="pages.veranstaltungen.upcoming.all_label"></button>
            <each loop="m, mi in eventsByMonth">
              <button type="button" class="month-chip" data-month="{{ m.key }}" aria-pressed="false" data-t="eventsByMonth.{{ mi }}.label"></button>
            </each>
          </div>
        </if>

        <if condition="eventsByMonth.length">
          <each loop="m, mi in eventsByMonth">
            <div class="month-block" data-month="{{ m.key }}">
              <h3 class="month-heading" data-t="eventsByMonth.{{ mi }}.label"></h3>
              <each loop="e, ei in m.items">
                <article class="event-card" style="--cat: {{ e.category_color }}">
                  <div class="event-card-media" data-bg="eventsByMonth.{{ mi }}.items.{{ ei }}.image">
                    <if condition="!e.image">
                      <span class="event-day">{{ e.day }}</span>
                      <span class="event-month" data-t="eventsByMonth.{{ mi }}.items.{{ ei }}.month_short"></span>
                    </if>
                  </div>
                  <div class="event-card-body">
                    <if condition="e.category_name"><span class="event-tag" data-t="eventsByMonth.{{ mi }}.items.{{ ei }}.category_name"></span></if>
                    <h3 data-t="eventsByMonth.{{ mi }}.items.{{ ei }}.title"></h3>
                    <p class="event-meta"><i class="fa-regular fa-clock" aria-hidden="true"></i> <span data-t="eventsByMonth.{{ mi }}.items.{{ ei }}.date_label"></span></p>
                    <if condition="e.location"><p class="event-meta"><i class="fa-solid fa-location-dot" aria-hidden="true"></i> <span data-t="eventsByMonth.{{ mi }}.items.{{ ei }}.location"></span></p></if>
                    <if condition="e.description"><p class="event-desc" data-t="eventsByMonth.{{ mi }}.items.{{ ei }}.description"></p></if>
                    <a class="link-arrow" href="{{ e.calendar_link }}" target="_blank" rel="noopener" data-t="pages.veranstaltungen.upcoming.calendar_button"></a>
                  </div>
                </article>
              </each>
            </div>
          </each>
        </if>
        <else>
          <p class="empty-state" data-t="pages.veranstaltungen.upcoming.empty_text"></p>
        </else>
      </div>
    </section>

    <section class="section section-tint">
      <div class="container">
        <div class="section-head">
          <h2 data-t="pages.veranstaltungen.regular.title"></h2>
          <p data-t="pages.veranstaltungen.regular.subtitle"></p>
        </div>
        <div class="meeting-grid">
          <each loop="item, i in homepage.meetings.items">
            <if condition="item.show !== false">
              <article class="meeting">
                <div class="meeting-media" data-bg="homepage.meetings.items.{{ i }}.image"></div>
                <div class="meeting-body">
                  <p class="meeting-label" data-t="homepage.meetings.items.{{ i }}.label"></p>
                  <h3 data-t="homepage.meetings.items.{{ i }}.title"></h3>
                  <p class="meeting-time"><i class="fa-regular fa-clock" aria-hidden="true"></i> <span data-t="homepage.meetings.items.{{ i }}.time"></span></p>
                </div>
              </article>
            </if>
          </each>
        </div>
      </div>
    </section>

    <section class="section cta-band">
      <div class="container narrow">
        <h2 data-t="pages.veranstaltungen.cta.title"></h2>
        <p data-t="pages.veranstaltungen.cta.text"></p>
        <a class="btn btn-gold" href="/#kontakt" data-t="pages.veranstaltungen.cta.button_text"></a>
      </div>
    </section>
  </main>

  <include src="partials/footer.html"></include>
</body>
</html>
