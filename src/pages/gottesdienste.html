<!DOCTYPE html>
<html lang="de">
<head>
  <include src="partials/head-common.html"></include>
  <title>{{ pages.gottesdienste.seo.meta_title }}</title>
  <meta name="description" content="{{ pages.gottesdienste.seo.meta_description }}">
  <link rel="canonical" href="https://newnessoflife.de/gottesdienste">
  <meta property="og:title" content="{{ pages.gottesdienste.seo.meta_title }}">
  <meta property="og:description" content="{{ pages.gottesdienste.seo.meta_description }}">
  <meta property="og:url" content="https://newnessoflife.de/gottesdienste">
  <meta property="og:image" content="https://newnessoflife.de{{ pages.gottesdienste.hero.background_image || '/images/Gebete.jpg' }}">
  {{{ servicesJsonLd }}}
</head>
<body class="page-services">
  <include src="partials/header.html"></include>

  <main id="inhalt">
    <section class="hero hero-page" data-bg="pages.gottesdienste.hero.background_image">
      <if condition="pages.gottesdienste.hero.video">
        <video class="hero-video" src="{{ pages.gottesdienste.hero.video }}" autoplay muted loop playsinline aria-hidden="true"></video>
      </if>
      <div class="container hero-inner">
        <h1 data-t="pages.gottesdienste.hero.title"></h1>
        <p class="hero-lead" data-t="pages.gottesdienste.hero.subtitle"></p>
        <p class="hero-facts">
          <span><i class="fa-regular fa-clock" aria-hidden="true"></i><span data-t="pages.gottesdienste.main_service.day"></span>, <span data-t="pages.gottesdienste.main_service.time"></span></span>
          <span><i class="fa-solid fa-location-dot" aria-hidden="true"></i><span data-t="settings.contact.address"></span>, <span data-t="settings.contact.city"></span></span>
        </p>
      </div>
    </section>

    <section class="section">
      <div class="container split">
        <div class="split-text">
          <h2 data-t="pages.gottesdienste.intro.title"></h2>
          <p class="text-large" data-t="pages.gottesdienste.intro.text"></p>
        </div>
        <div class="time-card">
          <h3 data-t="pages.gottesdienste.main_service.title"></h3>
          <p data-t="pages.gottesdienste.main_service.description"></p>
          <dl>
            <dt><i class="fa-regular fa-calendar" aria-hidden="true"></i></dt><dd data-t="pages.gottesdienste.main_service.day"></dd>
            <dt><i class="fa-regular fa-clock" aria-hidden="true"></i></dt><dd data-t="pages.gottesdienste.main_service.time"></dd>
            <if condition="pages.gottesdienste.main_service.duration">
              <dt><i class="fa-solid fa-hourglass-half" aria-hidden="true"></i></dt><dd data-t="pages.gottesdienste.main_service.duration"></dd>
            </if>
            <dt><i class="fa-solid fa-location-dot" aria-hidden="true"></i></dt><dd><span data-t="settings.contact.address"></span>, <span data-t="settings.contact.city"></span></dd>
          </dl>
        </div>
      </div>
      <div class="container">
        <div class="feature-grid" style="margin-top: 64px">
          <each loop="f, i in pages.gottesdienste.main_service.features">
            <div class="feature">
              <i class="fa-solid {{ f.icon || 'fa-star' }}" aria-hidden="true"></i>
              <h3 data-t="pages.gottesdienste.main_service.features.{{ i }}.title"></h3>
              <p data-t="pages.gottesdienste.main_service.features.{{ i }}.description"></p>
            </div>
          </each>
        </div>
      </div>
    </section>

    <section class="section section-tint">
      <div class="container split split-reverse">
        <div class="split-text">
          <h2 data-t="pages.gottesdienste.first_visit.title"></h2>
          <p class="text-large" data-t="pages.gottesdienste.first_visit.text"></p>
        </div>
        <figure class="split-media">
          <img src="/images/bible.und.hand.hoch.jpg" data-src="pages.gottesdienste.first_visit.image" alt="" loading="lazy">
        </figure>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="section-head">
          <h2 data-t="pages.gottesdienste.other_meetings.title"></h2>
        </div>
        <div class="meetings-list">
          <each loop="m, i in pages.gottesdienste.other_meetings.items">
            <div class="meeting-item">
              <i class="fa-solid {{ m.icon || 'fa-calendar' }}" aria-hidden="true"></i>
              <div>
                <h3 data-t="pages.gottesdienste.other_meetings.items.{{ i }}.title"></h3>
                <p class="when"><span data-t="pages.gottesdienste.other_meetings.items.{{ i }}.day"></span>, <span data-t="pages.gottesdienste.other_meetings.items.{{ i }}.time"></span></p>
                <p data-t="pages.gottesdienste.other_meetings.items.{{ i }}.description"></p>
              </div>
            </div>
          </each>
        </div>
      </div>
    </section>

    <section class="section cta-band">
      <div class="container narrow">
        <h2 data-t="pages.gottesdienste.cta.title"></h2>
        <p data-t="pages.gottesdienste.cta.text"></p>
        <a class="btn btn-gold" href="{{ pages.gottesdienste.cta.button_link || '#anfahrt' }}" data-t="pages.gottesdienste.cta.button_text"></a>
      </div>
    </section>

    <section class="section" id="anfahrt">
      <div class="container contact-grid">
        <div>
          <h2 data-t="pages.gottesdienste.anfahrt.title"></h2>
          <p class="contact-address"><span data-t="settings.contact.address"></span><br><span data-t="settings.contact.city"></span></p>
          <if condition="pages.gottesdienste.anfahrt.text">
            <p data-t="pages.gottesdienste.anfahrt.text"></p>
          </if>
          <a class="btn btn-primary" href="https://www.google.com/maps/dir/?api=1&destination={{ encodeURIComponent((settings.contact.address || '') + ', ' + (settings.contact.city || '')) }}" target="_blank" rel="noopener" data-t="homepage.service_info.directions_text">Route planen</a>
        </div>
        <div class="map">
          <iframe title="Karte: {{ settings.contact.address }}, {{ settings.contact.city }}" src="https://www.google.com/maps?q={{ encodeURIComponent((settings.contact.address || '') + ', ' + (settings.contact.city || '')) }}&amp;output=embed" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
      </div>
    </section>
  </main>

  <include src="partials/footer.html"></include>
</body>
</html>
