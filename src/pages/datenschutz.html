<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ pages.datenschutz.seo.meta_title || 'Datenschutz - Newness of Life' }}</title>
    <meta name="description" content="{{ pages.datenschutz.seo.meta_description || '' }}">
    <link rel="stylesheet" href="css/style.css?v=20260220r3">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="canonical" href="https://newnessoflife.de/datenschutz">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="de_DE">
    <meta property="og:site_name" content="Newness of Life Mainz">
    <meta property="og:title" content="{{ pages.datenschutz.seo.meta_title }}">
    <meta property="og:description" content="{{ pages.datenschutz.seo.meta_description }}">
    <meta property="og:url" content="https://newnessoflife.de/datenschutz">
    <meta property="og:image" content="https://newnessoflife.de/images/church-service.jpg">
    <meta name="twitter:card" content="summary_large_image">
</head>

<body>
    <include src="partials/header.html"></include>

    <main>
        <section class="content-section services-section" data-cms-section="hero">
            <img id="datenschutz-header-image" src="{{ pages.datenschutz.hero.background_image || 'images/kirche.jpg' }}" alt="" aria-hidden="true" class="section-background-image" loading="lazy" data-cms-field="hero.background_image" data-cms-label="Header Bild">
            <div class="overlay"></div>
            <div class="container">
                <h2 id="datenschutz-header-title" data-t="pages.datenschutz.hero.title">{{ pages.datenschutz.hero.title || 'Datenschutz' }}</h2>
                <if condition="pages.datenschutz.hero.subtitle">
                    <p class="section-subtitle" data-cms-field="hero.subtitle" data-cms-label="Untertitel">{{ pages.datenschutz.hero.subtitle }}</p>
                </if>
            </div>
        </section>
        <section class="content-section">
            <div class="container" id="datenschutz-content" data-t-html="pages.datenschutz.content_html"></div>
        </section>
    </main>

  <include src="partials/footer.html"></include>
  <script src="js/script.js?v=20260312r1"></script>
</body>
</html>
