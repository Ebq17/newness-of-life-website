<!DOCTYPE html>
<html lang="de">
<head>
  <include src="partials/head-common.html"></include>
  <title>{{ pages.spenden.seo.meta_title }}</title>
  <meta name="description" content="{{ pages.spenden.seo.meta_description }}">
  <link rel="canonical" href="https://newnessoflife.de/spenden">
  <meta property="og:title" content="{{ pages.spenden.seo.meta_title }}">
  <meta property="og:description" content="{{ pages.spenden.seo.meta_description }}">
  <meta property="og:url" content="https://newnessoflife.de/spenden">
</head>
<body class="page-donate">
  <include src="partials/header.html"></include>

  <main id="inhalt">
    <section class="hero hero-page" data-bg="pages.spenden.hero.background_image">
      <div class="container hero-inner">
        <h1 data-t="pages.spenden.hero.title"></h1>
        <p class="hero-lead" data-t="pages.spenden.hero.subtitle"></p>
        <a class="btn btn-gold" href="#spenden-optionen" data-t="pages.spenden.hero.button_text"></a>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="section-head"><h2 data-t="pages.spenden.impact.title"></h2></div>
        <div class="impact-grid">
          <each loop="it, i in pages.spenden.impact.items">
            <div class="feature">
              <i class="fa-solid {{ it.icon || 'fa-heart' }}" aria-hidden="true"></i>
              <h3 data-t="pages.spenden.impact.items.{{ i }}.title"></h3>
              <p data-t="pages.spenden.impact.items.{{ i }}.description"></p>
            </div>
          </each>
        </div>
      </div>
    </section>

    <section class="section section-tint" id="spenden-optionen">
      <div class="container">
        <div class="section-head"><h2 data-t="pages.spenden.options.title"></h2></div>
        <div class="donate-grid">
          <div class="donate-card">
            <h3><i class="fa-solid fa-building-columns" aria-hidden="true"></i> <span data-t="pages.spenden.bank_details.title"></span></h3>
            <p data-t="pages.spenden.bank_details.text"></p>
            <ul class="bank-list">
              <li><span class="label" data-t="pages.spenden.bank_details.recipient_label"></span><span class="value" data-t="pages.spenden.bank_details.account_holder"></span><span></span></li>
              <li><span class="label">IBAN</span><span class="value" id="bank-iban" data-t="pages.spenden.bank_details.iban"></span><button type="button" class="copy-btn" data-copy="#bank-iban" aria-label="IBAN kopieren"><i class="fa-regular fa-copy"></i></button></li>
              <li><span class="label">BIC</span><span class="value" id="bank-bic" data-t="pages.spenden.bank_details.bic"></span><button type="button" class="copy-btn" data-copy="#bank-bic" aria-label="BIC kopieren"><i class="fa-regular fa-copy"></i></button></li>
              <li><span class="label" data-t="pages.spenden.bank_details.bank_label"></span><span class="value" data-t="pages.spenden.bank_details.bank_name"></span><span></span></li>
              <li><span class="label" data-t="pages.spenden.bank_details.reference_label"></span><span class="value" id="bank-ref" data-t="pages.spenden.bank_details.reference"></span><button type="button" class="copy-btn" data-copy="#bank-ref" aria-label="Verwendungszweck kopieren"><i class="fa-regular fa-copy"></i></button></li>
            </ul>
          </div>
          <if condition="pages.spenden.online_donation.show !== false">
            <div class="donate-card">
              <h3><i class="fa-brands fa-paypal" aria-hidden="true"></i> <span data-t="pages.spenden.online_donation.title"></span></h3>
              <p data-t="pages.spenden.online_donation.text"></p>
              <a class="btn btn-primary" href="{{ pages.spenden.online_donation.paypal_link }}" target="_blank" rel="noopener" data-t="pages.spenden.online_donation.button_text"></a>
              <p class="note" data-t="pages.spenden.online_donation.note"></p>
            </div>
          </if>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container narrow">
        <h2 data-t="pages.spenden.receipt.title"></h2>
        <p class="text-large" data-t="pages.spenden.receipt.text"></p>
        <a class="btn btn-outline" href="mailto:{{ settings.contact.email }}?subject=Spendenquittung" data-t="pages.spenden.receipt.button_text"></a>
      </div>
    </section>
  </main>

  <include src="partials/footer.html"></include>
</body>
</html>
