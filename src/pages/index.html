<!DOCTYPE html>
<html lang="de">
<head>
  <include src="partials/head-common.html"></include>
  <title>{{ homepage.seo.meta_title || settings.site_title }}</title>
  <meta name="description" content="{{ homepage.seo.meta_description || settings.site_description }}">
  <link rel="canonical" href="https://newnessoflife.de/">
  <meta property="og:title" content="{{ homepage.seo.meta_title || settings.site_title }}">
  <meta property="og:description" content="{{ homepage.seo.meta_description || settings.site_description }}">
  <meta property="og:url" content="https://newnessoflife.de/">
  <meta property="og:image" content="https://newnessoflife.de{{ homepage.hero.background_image || '/images/bible.und.hand.hoch.jpg' }}">
  {{{ churchJsonLd }}}
</head>
<body class="page-home">
  <include src="partials/header.html"></include>

  <main id="inhalt">
    <section class="hero hero-home" data-bg="homepage.hero.background_image">
      <div class="container hero-inner">
        <h1 data-t="homepage.hero.title"></h1>
        <p class="hero-lead" data-t="homepage.hero.subtitle"></p>
        <div class="btn-row">
          <a class="btn btn-gold" href="{{ homepage.hero.cta_link }}" data-t="homepage.hero.cta_text"></a>
          <if condition="homepage.hero.cta2_text">
            <a class="btn btn-ghost-light" href="{{ homepage.hero.cta2_link }}" data-t="homepage.hero.cta2_text"></a>
          </if>
        </div>
      </div>
    </section>

    <section class="service-panel-wrap" aria-labelledby="service-panel-title">
      <div class="container">
        <div class="service-panel">
          <h2 id="service-panel-title" class="service-panel-title" data-t="homepage.service_info.title"></h2>
          <ul class="service-facts">
            <li>
              <i class="fa-regular fa-clock" aria-hidden="true"></i>
              <strong data-t="homepage.service_info.when"></strong>
            </li>
            <li>
              <i class="fa-solid fa-location-dot" aria-hidden="true"></i>
              <span>
                <strong><span data-t="settings.contact.address"></span>, <span data-t="settings.contact.city"></span></strong>
                <a class="link-arrow" href="https://www.google.com/maps/dir/?api=1&destination={{ encodeURIComponent((settings.contact.address || '') + ', ' + (settings.contact.city || '')) }}" target="_blank" rel="noopener" data-t="homepage.service_info.directions_text"></a>
              </span>
            </li>
            <if condition="homepage.service_info.kids">
              <li><i class="fa-solid fa-child-reaching" aria-hidden="true"></i><span data-t="homepage.service_info.kids"></span></li>
            </if>
            <if condition="homepage.service_info.language">
              <li><i class="fa-solid fa-language" aria-hidden="true"></i><span data-t="homepage.service_info.language"></span></li>
            </if>
          </ul>
        </div>
      </div>
    </section>

    <section class="section split-section">
      <div class="container split">
        <div class="split-text">
          <h2 data-t="homepage.services_section.title"></h2>
          <p class="text-large" data-t="homepage.services_section.description"></p>
          <a class="btn btn-primary" href="/gottesdienste" data-t="homepage.services_section.button_text"></a>
        </div>
        <figure class="split-media">
          <img src="/images/Gebete.jpg" data-src="homepage.services_section.image" alt="" loading="lazy">
        </figure>
      </div>
    </section>

    <section class="section section-tint" aria-labelledby="meetings-title">
      <div class="container">
        <div class="section-head">
          <h2 id="meetings-title" data-t="homepage.meetings.title"></h2>
          <p data-t="homepage.meetings.subtitle"></p>
        </div>
        <div class="meeting-grid">
          <each loop="item, i in homepage.meetings.items">
            <if condition="item.show !== false">
              <article class="meeting">
                <div class="meeting-media" data-bg="homepage.meetings.items.{{ i }}.image"></div>
                <div class="meeting-body">
                  <p class="meeting-label" data-t="homepage.meetings.items.{{ i }}.label"></p>
                  <h3 data-t="homepage.meetings.items.{{ i }}.title"></h3>
                  <p class="meeting-time"><i class="fa-regular fa-clock" aria-hidden="true"></i> <span data-t="homepage.meetings.items.{{ i }}.time"></span></p>
                  <if condition="item.link">
                    <a class="stretched-link" href="{{ item.link }}"><span class="sr-only">{{ item.title }}</span></a>
                  </if>
                </div>
              </article>
            </if>
          </each>
        </div>
      </div>
    </section>

    <section class="section about-teaser" aria-labelledby="about-title">
      <div class="container narrow">
        <h2 id="about-title" data-t="homepage.about_section.title"></h2>
        <p class="about-sub" data-t="homepage.about_section.subtitle"></p>
        <p class="text-large" data-t="homepage.about_section.text"></p>
        <a class="btn btn-outline" href="/ueber-uns" data-t="homepage.about_section.button_text"></a>
      </div>
    </section>

    <if condition="homepage.events_section.show !== false && upcomingEvents.length">
      <section class="section section-tint" aria-labelledby="events-title">
        <div class="container">
          <div class="section-head section-head-row">
            <div>
              <h2 id="events-title" data-t="homepage.events_section.title"></h2>
              <p data-t="homepage.events_section.text"></p>
            </div>
            <a class="link-arrow" href="/veranstaltungen" data-t="homepage.events_section.button_text"></a>
          </div>
          <ul class="event-list">
            <each loop="event, i in upcomingEvents">
              <li class="event-row">
                <div class="event-date" style="--cat: {{ event.category_color }}">
                  <span class="event-day">{{ event.day }}</span>
                  <span class="event-month" data-t="upcomingEvents.{{ i }}.month_short"></span>
                </div>
                <div class="event-info">
                  <h3 data-t="upcomingEvents.{{ i }}.title"></h3>
                  <p class="event-meta" data-t="upcomingEvents.{{ i }}.date_label"></p>
                </div>
              </li>
            </each>
          </ul>
        </div>
      </section>
    </if>

    <section class="section" id="kontakt" aria-labelledby="contact-title">
      <div class="container">
        <div class="section-head">
          <h2 id="contact-title" data-t="homepage.contact_section.title"></h2>
        </div>
        <div class="contact-grid">
          <div class="contact-card">
            <h3 data-t="homepage.contact_section.form_title"></h3>
            <form id="contact-form" name="contact" method="POST" action="/" data-netlify="true" netlify-honeypot="website" novalidate
                  data-msg-ok="{{ homepage.contact_section.success_message }}" data-msg-ok-en="{{ homepage.contact_section.success_message_en }}"
                  data-msg-error="{{ homepage.contact_section.error_message }}" data-msg-error-en="{{ homepage.contact_section.error_message_en }}">
              <input type="hidden" name="form-name" value="contact">
              <p class="is-hidden"><label>Website <input name="website" tabindex="-1" autocomplete="off"></label></p>
              <label class="field">
                <span class="sr-only" data-t="homepage.contact_section.name_placeholder"></span>
                <input type="text" name="name" autocomplete="name" required data-placeholder="homepage.contact_section.name_placeholder">
              </label>
              <label class="field">
                <span class="sr-only" data-t="homepage.contact_section.email_placeholder"></span>
                <input type="email" name="email" autocomplete="email" required data-placeholder="homepage.contact_section.email_placeholder">
              </label>
              <label class="field">
                <span class="sr-only" data-t="homepage.contact_section.message_placeholder"></span>
                <textarea name="message" rows="5" required data-placeholder="homepage.contact_section.message_placeholder"></textarea>
              </label>
              <button type="submit" class="btn btn-primary" data-t="homepage.contact_section.send_button"></button>
              <p class="form-status" id="contact-status" role="status" aria-live="polite"></p>
            </form>
          </div>
          <div class="contact-details">
            <h3 data-t="homepage.contact_section.address_title"></h3>
            <p class="contact-address">
              <span data-t="settings.contact.address"></span><br>
              <span data-t="settings.contact.city"></span>
            </p>
            <if condition="settings.contact.email">
              <p><a href="mailto:{{ settings.contact.email }}">{{ settings.contact.email }}</a></p>
            </if>
            <div class="map">
              <iframe title="Karte: {{ settings.contact.address }}, {{ settings.contact.city }}" src="https://www.google.com/maps?q={{ encodeURIComponent((settings.contact.address || '') + ', ' + (settings.contact.city || '')) }}&amp;output=embed" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <include src="partials/footer.html"></include>
</body>
</html>
