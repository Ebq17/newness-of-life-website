<!DOCTYPE html>
<html lang="de">
<head>
  <include src="partials/head-common.html"></include>
  <title>{{ pages.ueberUns.seo.meta_title }}</title>
  <meta name="description" content="{{ pages.ueberUns.seo.meta_description }}">
  <link rel="canonical" href="https://newnessoflife.de/ueber-uns">
  <meta property="og:title" content="{{ pages.ueberUns.seo.meta_title }}">
  <meta property="og:description" content="{{ pages.ueberUns.seo.meta_description }}">
  <meta property="og:url" content="https://newnessoflife.de/ueber-uns">
  <meta property="og:image" content="https://newnessoflife.de{{ pages.ueberUns.hero.background_image || '/images/Gebete.jpg' }}">
</head>
<body class="page-about">
  <include src="partials/header.html"></include>

  <main id="inhalt">
    <section class="hero hero-page" data-bg="pages.ueberUns.hero.background_image">
      <div class="container hero-inner">
        <h1 data-t="pages.ueberUns.hero.title"></h1>
        <p class="hero-lead" data-t="pages.ueberUns.hero.subtitle"></p>
      </div>
    </section>

    <section class="section">
      <div class="container split">
        <div class="split-text prose">
          <h2 data-t="pages.ueberUns.intro.title"></h2>
          <p class="prose-lead" data-t="pages.ueberUns.intro.subtitle"></p>
          <p data-t="pages.ueberUns.intro.text"></p>
          <if condition="pages.ueberUns.intro.mission">
            <p class="mission" data-t="pages.ueberUns.intro.mission"></p>
          </if>
        </div>
        <figure class="logo-figure">
          <img src="/images/Logo_Schwarz_Transparent_KS.png" data-src="pages.ueberUns.intro.image" alt="" loading="lazy">
        </figure>
      </div>
    </section>

    <section class="section section-tint">
      <div class="container split split-top">
        <div class="prose">
          <h2 data-t="pages.ueberUns.story.title"></h2>
          <h3 data-t="pages.ueberUns.story.subtitle"></h3>
          <p data-t="pages.ueberUns.story.text"></p>
        </div>
        <div class="prose">
          <h2 data-t="pages.ueberUns.vision.title"></h2>
          <p class="prose-lead" data-t="pages.ueberUns.vision.text"></p>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="section-head"><h2 data-t="pages.ueberUns.values.title"></h2></div>
        <div class="values-grid">
          <each loop="v, i in pages.ueberUns.values.items">
            <article class="value">
              <h3 data-t="pages.ueberUns.values.items.{{ i }}.title"></h3>
              <if condition="v.verse"><span class="verse" data-t="pages.ueberUns.values.items.{{ i }}.verse"></span></if>
              <p data-t="pages.ueberUns.values.items.{{ i }}.text"></p>
            </article>
          </each>
        </div>
      </div>
    </section>

    <section class="section section-tint">
      <div class="container">
        <div class="section-head">
          <h2 data-t="pages.ueberUns.roots.title"></h2>
          <p data-t="pages.ueberUns.roots.text"></p>
        </div>
        <div class="roots-grid">
          <each loop="r, i in pages.ueberUns.roots.items">
            <article class="roots-card">
              <img src="{{ r.image }}" data-src="pages.ueberUns.roots.items.{{ i }}.image" alt="" loading="lazy">
              <div>
                <h3 data-t="pages.ueberUns.roots.items.{{ i }}.title"></h3>
                <p data-t="pages.ueberUns.roots.items.{{ i }}.text"></p>
                <if condition="r.link"><a class="link-arrow" href="{{ r.link }}" target="_blank" rel="noopener" data-t="pages.ueberUns.roots.items.{{ i }}.button_text"></a></if>
              </div>
            </article>
          </each>
        </div>
      </div>
    </section>
  </main>

  <include src="partials/footer.html"></include>
</body>
</html>
