<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Website-Admin – Newness of Life</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="/admin/admin.css?v=20261013">
</head>
<body>
  <!-- Anmeldung -->
  <section id="login-view" class="login" hidden>
    <div class="login-card">
      <img src="/images/Logo_Schwarz_Transparent_KS.png" alt="" width="72" height="72">
      <h1>Website-Admin</h1>
      <p class="muted">Newness of Life</p>
      <form id="login-form">
        <label for="login-email">Deine E-Mail-Adresse</label>
        <input id="login-email" type="email" autocomplete="email" required placeholder="name@beispiel.de">
        <button class="btn btn-primary" type="submit">Anmelde-Link schicken</button>
      </form>
      <p id="login-status" class="status" role="status" aria-live="polite"></p>
      <p class="muted small">Du bekommst einen Link per E-Mail. Damit bist du 14 Tage angemeldet – ganz ohne Passwort.</p>
    </div>
  </section>

  <!-- Admin -->
  <div id="app-view" class="app" hidden>
    <aside class="sidebar">
      <div class="sidebar-brand">
        <img src="/images/Logo_Schwarz_Transparent_KS.png" alt="" width="36" height="36">
        <div><strong>Website-Admin</strong><span id="user-email"></span></div>
      </div>
      <nav id="page-nav" aria-label="Bereiche"></nav>
      <div class="sidebar-foot">
        <a href="/" target="_blank" rel="noopener"><i class="fa-solid fa-arrow-up-right-from-square"></i> Website ansehen</a>
        <button type="button" id="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Abmelden</button>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button type="button" class="nav-btn" id="nav-btn" aria-label="Bereiche anzeigen"><i class="fa-solid fa-bars"></i></button>
        <div class="topbar-title">
          <h1 id="page-title">…</h1>
          <p id="page-hint" class="muted"></p>
        </div>
        <label class="switch" title="Englische Texte bearbeiten">
          <input type="checkbox" id="en-toggle"> <span>Englisch</span>
        </label>
        <a id="view-page" class="btn btn-light" href="/" target="_blank" rel="noopener"><i class="fa-regular fa-eye"></i><span> Seite ansehen</span></a>
        <button type="button" class="btn btn-primary" id="save-btn" disabled><i class="fa-solid fa-floppy-disk"></i> Speichern</button>
      </header>
      <div id="save-status" class="save-status" role="status" aria-live="polite"></div>
      <div id="editor" class="editor"><p class="muted">Inhalte werden geladen …</p></div>
    </main>
  </div>

  <!-- Bildauswahl -->
  <dialog id="image-dialog" class="image-dialog">
    <form method="dialog" class="dialog-head">
      <h2>Bild auswählen</h2>
      <button class="icon-btn" value="cancel" aria-label="Schließen"><i class="fa-solid fa-xmark"></i></button>
    </form>
    <div class="dialog-upload">
      <label class="btn btn-primary"><i class="fa-solid fa-upload"></i> Neues Bild hochladen
        <input type="file" id="image-upload" accept="image/jpeg,image/png,image/webp,image/gif" hidden>
      </label>
      <span id="upload-status" class="muted"></span>
    </div>
    <div id="image-grid" class="image-grid"></div>
  </dialog>

  <script src="/admin/admin.js?v=20261013"></script>
</body>
</html>
